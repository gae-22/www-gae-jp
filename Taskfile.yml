version: '3'

vars:
    PORT: '{{.PORT | default "4321"}}'
    HOST: '{{.HOST | default "0.0.0.0"}}'
    DIST_DIR: dist

tasks:
    default:
        desc: Show available tasks
        cmds:
            - task --list

    install:
        desc: Install dependencies
        cmds:
            - pnpm install
        sources:
            - package.json
            - pnpm-lock.yaml
        generates:
            - node_modules/**

    dev:
        desc: Start development server
        cmds:
            - pnpm dev

    build:
        desc: Build for production
        deps: [install]
        cmds:
            - pnpm build
        sources:
            - src/**/*
            - public/**/*
            - astro.config.mjs
            - package.json
            - tsconfig.json
        generates:
            - '{{.DIST_DIR}}/**'

    start:
        desc: Start production server from dist/
        cmds:
            - PORT={{.PORT}} HOST={{.HOST}} node {{.DIST_DIR}}/server/entry.mjs

    preview:
        desc: Preview production build (via Astro)
        cmds:
            - pnpm preview

    clean:
        desc: Remove build artifacts
        cmds:
            - rm -rf {{.DIST_DIR}} .astro

    rebuild:
        desc: Clean and build
        cmds:
            - task: clean
            - task: build

    check:
        desc: Run Astro type checking
        cmds:
            - pnpm astro check

    deploy:
        desc: Build and show deploy instructions
        cmds:
            - task: build
            - echo ""
            - echo "=== Deploy ==="
            - echo "Copy the '{{.DIST_DIR}}/' directory to your server and run:"
            - echo "  PORT={{.PORT}} node {{.DIST_DIR}}/server/entry.mjs"
            - echo ""
            - echo "No node_modules required. Only Node.js is needed."

    service:install:
        desc: Install systemd service
        cmds:
            - sudo cp www-gae-jp.service /etc/systemd/system/
            - sudo systemctl daemon-reload
            - sudo systemctl enable www-gae-jp
            - echo "Service installed. Run 'task service:start' to start."

    service:start:
        desc: Start the systemd service
        cmds:
            - sudo systemctl start www-gae-jp

    service:stop:
        desc: Stop the systemd service
        cmds:
            - sudo systemctl stop www-gae-jp

    service:restart:
        desc: Restart the systemd service
        cmds:
            - sudo systemctl restart www-gae-jp

    service:status:
        desc: Show service status
        cmds:
            - sudo systemctl status www-gae-jp

    service:logs:
        desc: Show service logs
        cmds:
            - journalctl -u www-gae-jp -f
